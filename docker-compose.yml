services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: portfly
      POSTGRES_PASSWORD: portfly
      POSTGRES_DB: portfly
    ports:
      - "5432:5432"
    volumes:
      - portfly_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfly -d portfly"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://portfly:portfly@db:5432/portfly
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-nvidia/nemotron-3-ultra-550b-a55b:free}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      MAX_HISTORY_MESSAGES: ${MAX_HISTORY_MESSAGES:-16}
      DESK_TOKEN: ${DESK_TOKEN:-}
      FRONTEND_ORIGIN: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy

volumes:
  portfly_pg: